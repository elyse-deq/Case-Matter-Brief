<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Matter Intelligence Brief flow</title><desc id="d">A new document is extracted, validated against its source, checked for materiality, and either applied to the matter record or sent to attorney review. Rejected output is logged. The brief is rendered from the record, with dates computed by a deterministic engine.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2733"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b42318"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b54708"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f5c63"/></marker></defs><rect width="1240" height="560" fill="#fff"/><text x="20" y="38" font-size="22" font-weight="700" fill="#1b2733">How a new document becomes a current brief</text><text x="20" y="62" font-size="14" fill="#52606d">Models propose. A validated record holds the truth. The brief is a view of that record.</text><rect x="20" y="110" width="150" height="100" rx="6" fill="#fff" stroke="#1b2733" stroke-width="1.75"/><text x="32" y="142" font-size="14" font-weight="700" fill="#1b2733">New material</text><text x="32" y="166" font-size="12" fill="#52606d">filing, order, email</text><text x="32" y="184" font-size="12" fill="#52606d">arrives for a matter</text><rect x="230" y="110" width="150" height="100" rx="6" fill="#fff" stroke="#1b2733" stroke-width="1.75"/><text x="242" y="142" font-size="14" font-weight="700" fill="#1b2733">Extractor</text><text x="242" y="166" font-size="12" fill="#52606d">rules, LLM, Harvey</text><text x="242" y="184" font-size="12" fill="#52606d">proposes changes</text><rect x="440" y="110" width="150" height="100" rx="6" fill="#fff" stroke="#1b2733" stroke-width="1.75"/><text x="452" y="142" font-size="14" font-weight="700" fill="#1b2733">Validation gate</text><text x="452" y="166" font-size="12" fill="#52606d">quote and dates must</text><text x="452" y="184" font-size="12" fill="#52606d">match the document</text><rect x="650" y="110" width="150" height="100" rx="6" fill="#fff" stroke="#1b2733" stroke-width="1.75"/><text x="662" y="142" font-size="14" font-weight="700" fill="#1b2733">Materiality check</text><text x="662" y="166" font-size="12" fill="#52606d">new or moved date,</text><text x="662" y="184" font-size="12" fill="#52606d">new adverse party?</text><rect x="860" y="110" width="150" height="100" rx="6" fill="#0f5c63" stroke="#0f5c63" stroke-width="1.75"/><text x="872" y="142" font-size="14" font-weight="700" fill="#fff">Matter record</text><text x="872" y="166" font-size="12" fill="#d7ebec">approved facts and</text><text x="872" y="184" font-size="12" fill="#d7ebec">change log, cited</text><rect x="1070" y="110" width="150" height="100" rx="6" fill="#0f5c63" stroke="#0f5c63" stroke-width="1.75"/><text x="1082" y="142" font-size="14" font-weight="700" fill="#fff">Matter brief</text><text x="1082" y="166" font-size="12" fill="#d7ebec">what changed first,</text><text x="1082" y="184" font-size="12" fill="#d7ebec">every line cited</text><path d="M170 160 H227" fill="none" stroke="#1b2733" stroke-width="1.75" marker-end="url(#a)"/><path d="M380 160 H437" fill="none" stroke="#1b2733" stroke-width="1.75" marker-end="url(#a)"/><path d="M590 160 H647" fill="none" stroke="#1b2733" stroke-width="1.75" marker-end="url(#a)"/><path d="M800 160 H857" fill="none" stroke="#1b2733" stroke-width="1.75" marker-end="url(#a)"/><path d="M1010 160 H1067" fill="none" stroke="#1b2733" stroke-width="1.75" marker-end="url(#a)"/><text x="410" y="152" font-size="12" font-weight="600" fill="#52606d" text-anchor="middle">propose</text><text x="620" y="152" font-size="12" font-weight="600" fill="#52606d" text-anchor="middle">passes</text><text x="830" y="152" font-size="12" font-weight="600" fill="#52606d" text-anchor="middle">apply</text><text x="1040" y="152" font-size="12" font-weight="600" fill="#52606d" text-anchor="middle">renders</text><rect x="440" y="300" width="150" height="90" rx="6" fill="#fff" stroke="#b42318" stroke-width="1.75"/><text x="452" y="332" font-size="14" font-weight="700" fill="#1b2733">Rejection log</text><text x="452" y="356" font-size="12" fill="#52606d">ungrounded output</text><text x="452" y="374" font-size="12" fill="#52606d">kept for audit</text><rect x="650" y="300" width="150" height="90" rx="6" fill="#fff" stroke="#b54708" stroke-width="1.75"/><text x="662" y="332" font-size="14" font-weight="700" fill="#1b2733">Attorney review</text><text x="662" y="356" font-size="12" fill="#52606d">approve or reject</text><text x="662" y="374" font-size="12" fill="#52606d">before it counts</text><rect x="1070" y="300" width="150" height="90" rx="6" fill="#f3f6f8" stroke="#1b2733" stroke-width="1.75"/><text x="1082" y="332" font-size="14" font-weight="700" fill="#1b2733">Deadline engine</text><text x="1082" y="356" font-size="12" fill="#52606d">due dates by code,</text><text x="1082" y="374" font-size="12" fill="#52606d">holidays, extensions</text><path d="M515 210 V297" fill="none" stroke="#b42318" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="525" y="250" font-size="12" font-weight="600" fill="#b42318" text-anchor="start">rejected</text><path d="M725 210 V297" fill="none" stroke="#b54708" stroke-width="1.75" marker-end="url(#am)"/><text x="735" y="250" font-size="12" font-weight="600" fill="#b54708" text-anchor="start">material</text><path d="M800 345 H890 V213" fill="none" stroke="#0f5c63" stroke-width="1.75" marker-end="url(#at)"/><text x="847.0" y="337" font-size="12" font-weight="600" fill="#0f5c63" text-anchor="middle">approve</text><path d="M970 210 V345 H1067" fill="none" stroke="#1b2733" stroke-width="1.75" marker-end="url(#a)"/><text x="1020.0" y="337" font-size="11.5" font-weight="600" fill="#52606d" text-anchor="middle">trigger, days</text><path d="M1145 300 V213" fill="none" stroke="#1b2733" stroke-width="1.75" marker-end="url(#a)"/><text x="1155" y="250" font-size="12" font-weight="600" fill="#52606d" text-anchor="start">due dates</text><rect x="20" y="440" width="390" height="92" rx="6" fill="#f3f6f8" stroke="#d5dbe1" stroke-width="1"/><rect x="20" y="440" width="4" height="92" fill="#0f5c63"/><text x="40" y="470" font-size="15" font-weight="700" fill="#1b2733">No source, no fact</text><text x="40" y="494" font-size="13" fill="#52606d">Every proposal needs a verbatim quote</text><text x="40" y="512" font-size="13" fill="#52606d">from the source document.</text><rect x="425" y="440" width="390" height="92" rx="6" fill="#f3f6f8" stroke="#d5dbe1" stroke-width="1"/><rect x="425" y="440" width="4" height="92" fill="#0f5c63"/><text x="445" y="470" font-size="15" font-weight="700" fill="#1b2733">Deadlines are code</text><text x="445" y="494" font-size="13" fill="#52606d">Models capture the trigger and the period.</text><text x="445" y="512" font-size="13" fill="#52606d">A deterministic engine does the math.</text><rect x="830" y="440" width="390" height="92" rx="6" fill="#f3f6f8" stroke="#d5dbe1" stroke-width="1"/><rect x="830" y="440" width="4" height="92" fill="#0f5c63"/><text x="850" y="470" font-size="15" font-weight="700" fill="#1b2733">Humans approve what matters</text><text x="850" y="494" font-size="13" fill="#52606d">New or moved deadlines and new adverse</text><text x="850" y="512" font-size="13" fill="#52606d">parties wait for a lawyer to approve.</text></svg>